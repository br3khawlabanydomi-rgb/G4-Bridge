<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 4 Week 4 | Fair for Everyone - Making Outcomes Fairer</title><style>body{font:17px/1.5 Arial,sans-serif;margin:0;background:#f4f8fb;color:#18324a}header{background:#0d4772;color:white;padding:1.3rem max(1rem,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:1rem auto;padding:0 1rem}.layout{display:grid;grid-template-columns:220px 1fr;gap:1rem}nav,section{background:white;border:1px solid #d7e2e9;border-radius:12px;padding:1rem}nav{display:grid;gap:.3rem;align-self:start}button{font:inherit;padding:.6rem;border:0;border-radius:8px;background:#075985;color:white;cursor:pointer}nav button{background:white;color:#18324a;text-align:left}nav button[aria-current=true]{background:#e4f2f9;color:#075985;font-weight:bold}.safe,.box{padding:.8rem;background:#eaf5fb;border-left:5px solid #075985;margin:1rem 0;border-radius:6px}.safe{background:#fff3d8;border-color:#bf8000}.feedback{font-weight:bold;min-height:1.5rem}.good{color:#17623d}.bad{color:#9a3412}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d7e2e9;padding-top:1rem;margin-top:1rem}.bar{height:9px;background:#ffffff66;border-radius:8px}.bar span{display:block;height:100%;width:0;background:#f4bb52}a{color:#075985}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{grid-template-columns:1fr 1fr}}</style></head><body><header><div>ICS | AI/CS BRIDGING · Grade 4 · Term 1 · Week 4</div><h1>Fair for Everyone - Making Outcomes Fairer</h1><p>Suggests simple ways to make outcomes fairer.</p><div class="bar"><span id="progress"></span></div></header><main><div class="layout"><nav aria-label="Lesson sections"><button>1. Welcome & safety</button><button>2. Learn</button><button>3. Explore</button><button>4. Practice</button><button>5. Worksheet</button><button>6. Assessment</button><button>7. Reflection</button></nav><section id="content" tabindex="-1"></section></div></main><footer style="max-width:1000px;margin:auto;padding:1rem">Teacher supervised · Fictional examples only · Progress remains in this browser tab.</footer><script>const pages=["welcome","learn","explore","practice","worksheet","assess","reflect"];let pos=0,done=new Set(),score=0,scored=new Set();const c=document.getElementById('content');function frame(title,body){c.innerHTML='<h2>'+title+'</h2>'+body+'<div class="bottom"><button id="prev">← Back</button><span>'+ (pos+1)+' of '+pages.length+'</span><button id="next">Next →</button></div>';done.add(pages[pos]);document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',i===pos?'true':'false'));document.getElementById('progress').style.width=(100*done.size/pages.length)+'%';document.getElementById('prev').onclick=()=>go(Math.max(0,pos-1));document.getElementById('next').onclick=()=>go(Math.min(pages.length-1,pos+1))}function go(i){pos=i;render()}function render(){let k=pages[pos];if(k==='welcome')frame('Welcome!',`<div class="safe"><b>Safety:</b> Use fictional classroom examples only. Do not enter real names, ID details, photos, or private information.</div><div class="box"><b>Learning goals</b><ul><li>I can explain who is disadvantaged in a situation and why.</li><li>I can suggest one clear change that would make it fairer.</li><li>I can give a reason that shows why my change is fairer.</li></ul></div><p>Suggests simple ways to make outcomes fairer.</p>`);if(k==='learn')frame('Learn the key idea',`<p>Fairness checks ask: who is affected, what rule or information causes fewer chances, what change addresses that cause, and who else might be affected?</p><div class="box">fair; unfair; chance; rule; information; disadvantaged; justify</div>`);if(k==='explore')frame('Explore the example',`<p>If only the fastest hand-raiser answers, quieter or slower students may never get a turn. Taking turns in order gives everyone a chance to answer.</p><div class="box"><button onclick="document.getElementById('demo').textContent='Take turns in order: each student gets a real chance.'">Try a fairer turn rule</button> <button onclick="document.getElementById('demo').textContent='Accept entries the next day too, so absence does not remove a student from the draw.'">Try a fairer draw</button></div><div id="demo" class="feedback" aria-live="polite"></div>`);if(k==='practice')frame('Guided practice',`<p>Only the fastest hand-raiser answers. Which change gives everyone a chance?</p><button onclick="choose(true,'practice')">Take turns in order.</button> <button onclick="choose(false,'practice')">Let only the fastest answer.</button> <button onclick="choose(false,'practice')">Stop the activity.</button> <div id="practice" class="feedback" aria-live="polite"></div>`);if(k==='worksheet')frame('Worksheet tasks',`<p>Read a scenario, name who is disadvantaged, identify the cause, propose one fairer change, and check who else it affects.</p><div class="box">Complete the mapped worksheet and record your evidence.</div><p><a href="ICS_AI-CS_Bridging_G04_T1_W04_Worksheet.pdf">Open the Week 4 worksheet PDF</a></p><p>Print or download it as your teacher directs.</p>`);if(k==='assess')frame('Post-assessment',`<p>Answer each question; then check your score.</p><div class="box"><b>1.</b> Who may be disadvantaged by the fastest-hand rule?<br><button onclick="choose(true,'a0')">Quieter or slower students who do not get a turn.</button> <button onclick="choose(false,'a0')">Only students who already answered.</button> <button onclick="choose(false,'a0')">No one; speed always gives everyone equal chances.</button> <div id="a0" class="feedback" aria-live="polite"></div></div><div class="box"><b>2.</b> What causes some students to miss out?<br><button onclick="choose(true,'a1')">The rule gives the turn to whoever raises a hand fastest.</button> <button onclick="choose(false,'a1')">The classroom has too many chairs.</button> <button onclick="choose(false,'a1')">The question has more than one word.</button> <div id="a1" class="feedback" aria-live="polite"></div></div><div class="box"><b>3.</b> Which change gives everyone a real chance?<br><button onclick="choose(true,'a2')">Take turns in order so each student can contribute.</button> <button onclick="choose(false,'a2')">Choose the same fastest student again.</button> <button onclick="choose(false,'a2')">Stop allowing anyone to answer.</button> <div id="a2" class="feedback" aria-live="polite"></div></div><p id="score">Score: 0/3</p>`);if(k==='reflect')frame('Reflection and completion',`<p>You visited ${'${done.size}'} of ${pages.length} sections.</p><div class="box">This is unfair to ___ because ___. A fairer change is ___ because ___.</div><p><a href="https://u.ae/en/information-and-services/visa-and-emirates-id/emirates-id">Official UAE Emirates ID information</a>. Never enter or display real ID details.</p><button onclick="resetLesson()">Reset lesson</button><p id="finish">Visit every section to complete the lesson.</p>`)}function choose(ok,id){const e=document.getElementById(id);e.textContent=ok?'Correct. Explain why using the evidence.':'Try again. Check the instructions, rule, or data.';e.className='feedback '+(ok?'good':'bad');if(ok&&id.startsWith('a')&&!scored.has(id)){scored.add(id);score=scored.size}const s=document.getElementById('score');if(s)s.textContent='Score: '+score+'/3'}function resetLesson(){pos=0;done.clear();scored.clear();score=0;render()}document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>go(i));render();</script></body></html>
