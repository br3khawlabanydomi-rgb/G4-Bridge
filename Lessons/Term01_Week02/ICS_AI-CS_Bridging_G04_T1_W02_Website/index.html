<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 4 Week 2 | Spot the Mistake</title><style>
:root{--ink:#18324a;--blue:#075985;--pale:#eaf5fb;--gold:#f4bb52;--line:#d5e1e9;--good:#17623d;--bad:#9a3412}*{box-sizing:border-box}body{margin:0;font:17px/1.55 Arial,sans-serif;color:var(--ink);background:#f5f8fa}header{background:#0d4772;color:#fff;padding:1.3rem max(1rem,calc((100vw - 1100px)/2))}header .top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-weight:700}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:.7rem 0 .2rem}header p{margin:.2rem 0 1rem}.badge{background:#fff;color:#0d4772;padding:.25rem .65rem;border-radius:1rem}.bar{height:9px;background:#ffffff55;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}main{max-width:1100px;margin:1.2rem auto;padding:0 1rem}.layout{display:grid;grid-template-columns:230px 1fr;gap:1rem}nav,section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem}nav{align-self:start;display:grid;gap:.4rem}nav button,.btn,button.choice{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:.65rem .8rem}nav button{text-align:left;background:#fff;color:var(--ink)}nav button[aria-current=true]{background:var(--pale);font-weight:700;color:var(--blue)}button:focus-visible,a:focus-visible{outline:3px solid #edaa1a;outline-offset:2px}.btn{background:var(--blue);color:#fff}.btn.secondary{background:#e7edf1;color:var(--ink)}h2{margin-top:0}.callout,.safe{background:var(--pale);border-left:5px solid var(--blue);padding:.8rem 1rem;margin:1rem 0;border-radius:8px}.safe{background:#fff3d8;border-color:#bd7900}.card{border:1px solid var(--line);border-radius:10px;padding:1rem;margin:.8rem 0}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.feedback{min-height:1.6rem;margin:.6rem 0;font-weight:700}.good{color:var(--good)}.try{color:var(--bad)}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{border:1px solid var(--line);padding:.55rem;text-align:left}th{background:#eaf2f7}.rule{display:inline-flex;gap:.5rem;flex-wrap:wrap;align-items:center;background:#f1f6fa;padding:.7rem;border-radius:8px}.navbottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:1rem;margin-top:1rem}.small{font-size:.93rem;color:#39566b}footer{max-width:1100px;margin:0 auto;padding:1rem;color:#4e6576;font-size:.9rem}a{color:#075985}@media(max-width:750px){.layout{grid-template-columns:1fr}nav{grid-template-columns:1fr 1fr}nav button{font-size:.92rem}table{font-size:.88rem}}
</style></head><body><header><div class="top"><span>ICS | AI/CS BRIDGING</span><span class="badge">Grade 4 · Term 1 · Week 2</span></div><h1>Spot the Mistake</h1><p>Checking information against a trusted source</p><div class="bar" aria-label="Lesson progress"><span id="progress"></span></div></header><main><div class="layout"><nav aria-label="Lesson sections"><button aria-current="true">1. Welcome & safety</button><button>2. Learn the errors</button><button>3. Compare records</button><button>4. Guided practice</button><button>5. Worksheet task</button><button>6. Post-assessment</button><button>7. Reflection</button></nav><section id="content" tabindex="-1"></section></div></main><footer>Teacher-supervised activity · Practice records are fictional · Progress stays in this browser tab and is not sent to a server.</footer><script>
const pages=['welcome','learn','compare','practice','worksheet','check','finish'];let current=0,score=0,done=new Set();const root=document.getElementById('content');
const source=[['12','Fatima','dates'],['18','Omar','pears'],['24','Layla','apples'],['31','Zayed','bananas'],['42','Noor','grapes'],['56','Sami','oranges']];
const card=[['12','Fatma','dates'],['18','Omar','pears'],['24','Layla',''],['31','Zayed','bananas'],['42','Noor','grapes'],['42','Noor','grapes']];
function tab(rows){return '<table><thead><tr><th>Record</th><th>Name</th><th>Fruit</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+(x||'— blank —')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function frame(title,body){root.innerHTML='<h2>'+title+'</h2>'+body+'<div class="navbottom"><button class="btn secondary" id="prev">← Back</button><span>Section '+(current+1)+' of '+pages.length+'</span><button class="btn" id="next">Next →</button></div>';document.getElementById('prev').onclick=()=>go(Math.max(0,current-1));document.getElementById('next').onclick=()=>go(Math.min(pages.length-1,current+1));document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',i===current?'true':'false'));done.add(pages[current]);document.getElementById('progress').style.width=(done.size/pages.length*100)+'%'}
function go(i){current=i;render()}function render(){let k=pages[current];if(k==='welcome')frame('Welcome, data detectives!',`<p>Today you will compare a data card with a trusted source, find errors, and explain specific fixes.</p><div class="safe"><b>Safeguarding:</b> Use only these fictional records. Do not enter real names, ID numbers, photos, or other private details.</div><div class="callout"><b>Learning goals</b><ul><li>Find wrong, missing, and duplicate entries.</li><li>Write a specific correction.</li><li>Explain why the source proves your fix.</li></ul></div><p>What evidence would help you decide whether a table is correct?</p>`);if(k==='learn')frame('Three kinds of data error',`<div class="card"><b>Wrong:</b> an entry does not match the source. <br><b>Missing:</b> a needed value is blank. <br><b>Duplicate:</b> the same record appears more than once.</div><p>A value that looks unusual is not automatically wrong. Compare it with a trusted source before you mark it.</p><div class="callout"><b>Specific fix:</b> “Change Fatma to Fatima because the source spells it Fatima.”</div><p>Why does accurate data matter? A computer uses the data it receives. Duplicates can make a count too high.</p>`);if(k==='compare')frame('Compare the data card with the source',`<p><b>Trusted source list</b> (fictional practice records):</p>${tab(source)}<p><b>Data card to check</b>:</p>${tab(card)}<p>Compare one record at a time. Can you find a wrong name, a missing fruit, and a duplicate record?</p><div class="small">Record ID 42 appears twice in the data card. The source has record 56 instead.</div>`);if(k==='practice')frame('Guided practice: find, fix, explain',`<p>Choose the best description for the name on record 12.</p><div class="row"><button class="choice" onclick="practice('wrong')">Wrong</button><button class="choice" onclick="practice('missing')">Missing</button><button class="choice" onclick="practice('duplicate')">Duplicate</button></div><div id="pr" class="feedback" aria-live="polite"></div><p>Now complete the sentence: “Record 12 should say ___ because the source says ___.”</p><label>My fix: <input id="fix" aria-label="Write a specific fix"></label> <button class="btn" onclick="checkFix()">Check my fix</button><div id="fixout" class="feedback" aria-live="polite"></div>`);if(k==='worksheet')frame('Worksheet task',`<p>Use your teacher’s trusted source list. On the mapped Week 2 worksheet:</p><ol><li>Label the three marked entries as wrong, missing, or duplicate.</li><li>Write two exact fixes and a reason from the source.</li><li>Complete the error-hunt table and exit ticket.</li></ol><div class="callout"><b>Sentence frame:</b> “This is a ___ error. It should say ___ because the source says ___.”</div><p><a href="ICS_AI-CS_Bridging_G04_T1_W02_Worksheet.pdf" target="_blank" rel="noopener">Open the Grade 4 Week 2 worksheet PDF</a></p><p>Print or download it and submit it as your teacher directs.</p>`);if(k==='check')frame('Post-assessment',`<p>Answer all three. Correct answers earn one point; you may retry.</p><div class="card"><b>1. Source: Fatima. Table: Fatma. What kind of error?</b><button class="choice" onclick="quiz(this,true,1)">Wrong</button><button class="choice" onclick="quiz(this,false,1)">Duplicate</button><div id="q1" class="feedback" aria-live="polite"></div></div><div class="card"><b>2. A needed fruit value is blank. What kind of error?</b><button class="choice" onclick="quiz(this,true,2)">Missing</button><button class="choice" onclick="quiz(this,false,2)">Wrong</button><div id="q2" class="feedback" aria-live="polite"></div></div><div class="card"><b>3. How can you prove a correction is right?</b><button class="choice" onclick="quiz(this,true,3)">Compare it with the trusted source</button><button class="choice" onclick="quiz(this,false,3)">Choose what looks most familiar</button><div id="q3" class="feedback" aria-live="polite"></div></div><p id="score" class="feedback" aria-live="polite">Score: ${score}/3</p>`);if(k==='finish')frame('Reflection and completion',`<p>Your lesson progress: <b>${done.size} of ${pages.length} sections visited</b>.</p><p>Remember: compare each row with a trusted source, give an exact fix, and explain your evidence.</p><div class="callout"><b>Exit ticket:</b> “I knew an entry was an error because ___. My fix is ___.”</div><p>Which error was hardest to find? What helped you check carefully?</p><p><a href="${'https://u.ae/en/information-and-services/visa-and-emirates-id/emirates-id'}" target="_blank" rel="noopener">Official UAE Emirates ID information</a> · Never enter or show a real ID number.</p><button class="btn" onclick="resetLesson()">Reset lesson progress</button><p id="final" class="feedback">${done.size===pages.length?'Lesson complete. Well done!':'Visit each section to complete the lesson.'}</p>`);}
function practice(answer){let e=document.getElementById('pr');e.textContent=answer==='wrong'?'Correct: Fatma does not match Fatima in the trusted source.':'Try again: compare the spelling on record 12 with the source.';e.className='feedback '+(answer==='wrong'?'good':'try')}
function checkFix(){let v=(document.getElementById('fix').value||'').toLowerCase();let e=document.getElementById('fixout');e.textContent=v.includes('fatima')&&v.includes('because')?'Good fix: you named the source value and gave a reason.':'Add the exact source value “Fatima” and explain that the source uses that spelling.';e.className='feedback '+(v.includes('fatima')&&v.includes('because')?'good':'try')}
function quiz(btn,ok,n){let e=document.getElementById('q'+n);e.textContent=ok?'Correct. Check the source and the type of error.':'Try again. Compare the entry with the source.';e.className='feedback '+(ok?'good':'try');if(ok&&!btn.dataset.counted){score++;btn.dataset.counted='1'}let s=document.getElementById('score');if(s)s.textContent='Score: '+Math.min(score,3)+'/3'}
function resetLesson(){current=0;score=0;done.clear();render()}document.querySelectorAll('nav button').forEach((b,i)=>b.addEventListener('click',()=>go(i)));render();
</script></body></html>
