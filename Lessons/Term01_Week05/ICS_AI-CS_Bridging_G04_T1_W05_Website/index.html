<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 4 Week 5 | The Fair Decision Machine - Design &amp; Build (Part 1)</title><style>body{font:17px/1.5 Arial,sans-serif;margin:0;background:#f4f8fb;color:#18324a}header{background:#0d4772;color:white;padding:1.3rem max(1rem,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:1rem auto;padding:0 1rem}.layout{display:grid;grid-template-columns:220px 1fr;gap:1rem}nav,section{background:white;border:1px solid #d7e2e9;border-radius:12px;padding:1rem}nav{display:grid;gap:.3rem;align-self:start}button{font:inherit;padding:.6rem;border:0;border-radius:8px;background:#075985;color:white;cursor:pointer}nav button{background:white;color:#18324a;text-align:left}nav button[aria-current=true]{background:#e4f2f9;color:#075985;font-weight:bold}.safe,.box{padding:.8rem;background:#eaf5fb;border-left:5px solid #075985;margin:1rem 0;border-radius:6px}.safe{background:#fff3d8;border-color:#bf8000}.feedback{font-weight:bold;min-height:1.5rem}.good{color:#17623d}.bad{color:#9a3412}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d7e2e9;padding-top:1rem;margin-top:1rem}.bar{height:9px;background:#ffffff66;border-radius:8px}.bar span{display:block;height:100%;width:0;background:#f4bb52}a{color:#075985}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{grid-template-columns:1fr 1fr}}</style></head><body><header><div>ICS | AI/CS BRIDGING · Grade 4 · Term 1 · Week 5</div><h1>The Fair Decision Machine - Design &amp; Build (Part 1)</h1><p>Designs a simple rule-and-data decision machine, predicts decisions, and checks and improves data.</p><div class="bar"><span id="progress"></span></div></header><main><div class="layout"><nav aria-label="Lesson sections"><button>1. Welcome & safety</button><button>2. Learn</button><button>3. Explore</button><button>4. Practice</button><button>5. Worksheet</button><button>6. Assessment</button><button>7. Reflection</button></nav><section id="content" tabindex="-1"></section></div></main><footer style="max-width:1000px;margin:auto;padding:1rem">Teacher supervised · Fictional examples only · Progress remains in this browser tab.</footer><script>const pages=["welcome","learn","explore","practice","worksheet","assess","reflect"];let pos=0,done=new Set(),score=0,scored=new Set();const c=document.getElementById('content');function frame(title,body){c.innerHTML='<h2>'+title+'</h2>'+body+'<div class="bottom"><button id="prev">← Back</button><span>'+ (pos+1)+' of '+pages.length+'</span><button id="next">Next →</button></div>';done.add(pages[pos]);document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',i===pos?'true':'false'));document.getElementById('progress').style.width=(100*done.size/pages.length)+'%';document.getElementById('prev').onclick=()=>go(Math.max(0,pos-1));document.getElementById('next').onclick=()=>go(Math.min(pages.length-1,pos+1))}function go(i){pos=i;render()}function render(){let k=pages[pos];if(k==='welcome')frame('Welcome!',`<div class="safe"><b>Safety:</b> Use fictional classroom examples only. Do not enter real names, ID details, photos, or private information.</div><div class="box"><b>Learning goals</b><ul><li>I can design a decision machine with clear IF–THEN rules.</li><li>I can predict and explain what my machine will decide.</li><li>I can find and fix a data mistake and say why it matters.</li></ul></div><p>Designs a simple rule-and-data decision machine, predicts decisions, and checks and improves data.</p>`);if(k==='learn')frame('Learn the key idea',`<p>A decision machine matches item data to IF–THEN rules. Accurate data and clear rules both matter. Predict a result, verify the data, and explain the rule.</p><div class="box">goal; rule; condition; decision; data; source; predict</div>`);if(k==='explore')frame('Explore the example',`<p>Goal: sort books. IF it has a story THEN Fiction. IF it gives facts THEN Non-fiction. A storybook labelled “facts” needs a data fix.</p><div class="box"><p>Goal: sort books. IF story THEN Fiction. IF facts THEN Non-fiction.</p><button onclick="document.getElementById('demo').textContent='The trusted source says this book is a story. Its label “facts” is wrong.'">Check sample book data</button> <button onclick="document.getElementById('demo').textContent='Label fixed to story. The story rule now sorts the book to Fiction.'">Fix label and sort</button></div><div id="demo" class="feedback" aria-live="polite"></div>`);if(k==='practice')frame('Guided practice',`<p>A storybook card says “facts.” What should you do?</p><button onclick="choose(true,'practice')">Check and fix the book’s label using its trusted source.</button> <button onclick="choose(false,'practice')">Change every sorting rule.</button> <button onclick="choose(false,'practice')">Send all books to one shelf.</button> <div id="practice" class="feedback" aria-live="polite"></div>`);if(k==='worksheet')frame('Worksheet tasks',`<p>Design a goal, write rules, label item cards, predict and explain decisions, then compare data with a trusted source and fix one error.</p><div class="box">Complete the mapped worksheet and record your evidence.</div><p><a href="ICS_AI-CS_Bridging_G04_T1_W05_Worksheet.pdf">Open the Week 5 worksheet PDF</a></p><p>Print or download it as your teacher directs.</p>`);if(k==='assess')frame('Post-assessment',`<p>Answer each question; then check your score.</p><div class="box"><b>1.</b> What two parts does a decision machine use?<br><button onclick="choose(true,'a0')">Clear rules and accurate data.</button> <button onclick="choose(false,'a0')">A picture and a timer.</button> <button onclick="choose(false,'a0')">A random guess and a score.</button> <div id="a0" class="feedback" aria-live="polite"></div></div><div class="box"><b>2.</b> What is wrong with the fictional book card?<br><button onclick="choose(true,'a1')">A storybook is incorrectly labelled “facts.”</button> <button onclick="choose(false,'a1')">The book has no title.</button> <button onclick="choose(false,'a1')">The Fiction shelf is too small.</button> <div id="a1" class="feedback" aria-live="polite"></div></div><div class="box"><b>3.</b> What happens after correcting the label to “story”?<br><button onclick="choose(true,'a2')">The story rule sorts the book to Fiction.</button> <button onclick="choose(false,'a2')">The book becomes a non-fiction book.</button> <button onclick="choose(false,'a2')">The sorting rules stop working.</button> <div id="a2" class="feedback" aria-live="polite"></div></div><p id="score">Score: 0/3</p>`);if(k==='reflect')frame('Reflection and completion',`<p>You visited ${'${done.size}'} of ${pages.length} sections.</p><div class="box">My machine needs good rules and good data because ___.</div><p><a href="https://u.ae/en/information-and-services/visa-and-emirates-id/emirates-id">Official UAE Emirates ID information</a>. Never enter or display real ID details.</p><button onclick="resetLesson()">Reset lesson</button><p id="finish">Visit every section to complete the lesson.</p>`)}function choose(ok,id){const e=document.getElementById(id);e.textContent=ok?'Correct. Explain why using the evidence.':'Try again. Check the instructions, rule, or data.';e.className='feedback '+(ok?'good':'bad');if(ok&&id.startsWith('a')&&!scored.has(id)){scored.add(id);score=scored.size}const s=document.getElementById('score');if(s)s.textContent='Score: '+score+'/3'}function resetLesson(){pos=0;done.clear();scored.clear();score=0;render()}document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>go(i));render();</script></body></html>
